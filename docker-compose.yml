version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ipo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ipo_db}
      POSTGRES_USER: ${POSTGRES_USER:-ipo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipo_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ipo_user} -d ${POSTGRES_DB:-ipo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ipo_network

networks:
  ipo_network:
    driver: bridge

volumes:
  postgres_data:
    name: ipo_postgres_data
